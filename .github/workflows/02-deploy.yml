name: 02 - Build and Deploy to EKS

on:
  push:
    branches:
      - feature/eks

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: aws-training-app
  EKS_CLUSTER: main-eks-cluster
  K8S_DEPLOYMENT: aws-training-app
  K8S_CONTAINER: app
  K8S_NAMESPACE: default

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Authenticate GitHub Actions with AWS using OIDC
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------
      # 3. Login to Amazon ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------
      # 4. Build Docker image
      # --------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REPOSITORY:${{ github.sha }} .

      # --------------------------------------------------
      # 5. Tag Docker image
      # --------------------------------------------------
      - name: Tag Docker image
        run: |
          docker tag \
            $ECR_REPOSITORY:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}

      # --------------------------------------------------
      # 6. Push image to ECR
      # --------------------------------------------------
      - name: Push Docker image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}

      # --------------------------------------------------
      # 7. Configure kubectl for EKS
      # --------------------------------------------------
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER

      # --------------------------------------------------
      # 8. Verify EKS cluster
      # --------------------------------------------------
      - name: Verify Kubernetes cluster
        run: |
          kubectl get nodes
          kubectl get pods -A

      # --------------------------------------------------
      # 9. Apply Kubernetes manifests
      # --------------------------------------------------
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/

      # --------------------------------------------------
      # 10. Update deployment image
      # --------------------------------------------------
      - name: Update Kubernetes deployment image
        run: |
          kubectl set image deployment/$K8S_DEPLOYMENT \
            $K8S_CONTAINER=${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }} \
            -n $K8S_NAMESPACE

      # --------------------------------------------------
      # 11. Wait for rollout
      # --------------------------------------------------
      - name: Wait for deployment
        run: |
          kubectl rollout status \
            deployment/$K8S_DEPLOYMENT \
            -n $K8S_NAMESPACE \
            --timeout=5m

      # --------------------------------------------------
      # 12. Verify deployment
      # --------------------------------------------------
      - name: Verify application
        run: |
          kubectl get deployment -n $K8S_NAMESPACE
          kubectl get pods -n $K8S_NAMESPACE
          kubectl get services -n $K8S_NAMESPACE

      - name: Deployment complete
        run: |
          echo "EKS deployment completed successfully!"
          echo "Image tag: ${{ github.sha }}"